<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Messages • LINKA</title>

    <link rel="stylesheet" href="messages.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui.css?v=3">
</head>

<body>

<div class="app">

    <!-- ================= TOP BAR ================= -->
    <header class="topbar">

        <a class="brand" href="home.html" aria-label="LINKA home">
            <img src="homelogo.png" alt="LINKA home logo" class="brand-icon">
            <img src="homename.png" alt="LINKA" class="brand-wordmark">
        </a>

        <div class="top-search">
            <svg viewBox="0 0 24 24">
                <path d="M21 21l-4.35-4.35M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4z"/>
            </svg>
            <input type="text" id="globalSearch" placeholder="Search">
        </div>

        <div class="top-actions">

            <button class="icon-btn" id="notificationBtn" aria-label="Notifications">
                <svg viewBox="0 0 24 24">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
                </svg>
                <span class="notification-dot"></span>
            </button>

            <button class="icon-btn" aria-label="Messages">
                <svg viewBox="0 0 24 24">
                    <path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.8 9.8 0 0 1-4.2-.9L3 21l1.8-4.4A8.1 8.1 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>
                </svg>
            </button>

            <button class="profile-mini" id="profileMini" data-href="profile.html">
                <div class="avatar avatar-blue topbar-avatar" id="meAvatar">D</div>
                <span id="meName">Darcy</span>
                <svg viewBox="0 0 24 24">
                    <path d="M6 9l6 6 6-6"/>
                </svg>
            </button>

        </div>

    </header>


    <!-- ================= MAIN ================= -->
    <main class="messages-layout" id="messagesLayout">

        <!-- ================= CONVERSATIONS ================= -->
        <aside class="conversation-panel">

            <div class="messages-heading">

                <div>
                    <h1>Messages</h1>
                    <p id="conversationCount">0 conversations</p>
                </div>

                <button class="new-message-btn" id="newMessageBtn" aria-label="New message">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>

            </div>


            <!-- Message Search -->
            <div class="message-search">

                <svg viewBox="0 0 24 24">
                    <path d="M21 21l-4.35-4.35M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4z"/>
                </svg>

                <input
                    type="text"
                    id="messageSearch"
                    placeholder="Search messages"
                >

            </div>


            <!-- Filter Tabs -->
            <div class="message-tabs">

                <button class="tab active" data-filter="all">All</button>
                <button class="tab" data-filter="unread">Unread</button>
                <button class="tab" data-filter="groups">Groups</button>

            </div>


            <!-- Conversations (rendered by messages.js) -->
            <div class="conversation-list" id="conversationList"></div>

        </aside>


        <!-- ================= CHAT AREA ================= -->
        <section class="chat-panel" id="chatPanel">

            <!-- Chat Header -->
            <div class="chat-header">

                <div class="chat-person">

                    <button class="mobile-back" id="mobileBack" aria-label="Back to conversations">
                        <svg viewBox="0 0 24 24">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                    </button>

                    <div class="chat-avatar">
                        <div class="avatar" id="chatAvatar"></div>
                        <span class="online" id="chatOnline"></span>
                    </div>

                    <div class="chat-person-info">
                        <h2 id="chatName"></h2>
                        <span id="chatStatus"></span>
                    </div>

                </div>


                <div class="chat-actions">

                    <button class="chat-action" aria-label="Voice call">
                        <svg viewBox="0 0 24 24">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 3.08 5.18 2 2 0 0 1 5.06 3h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L9 10.73a16 16 0 0 0 4.27 4.27l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"/>
                        </svg>
                    </button>

                    <button class="chat-action" aria-label="Video call">
                        <svg viewBox="0 0 24 24">
                            <path d="M15 10l4.55-2.27A1 1 0 0 1 21 8.62v6.76a1 1 0 0 1-1.45.89L15 14"/>
                            <rect x="3" y="6" width="12" height="12" rx="2"/>
                        </svg>
                    </button>

                    <button class="chat-action" id="infoBtn" aria-label="Conversation info">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M12 11v5"/>
                            <path d="M12 8h.01"/>
                        </svg>
                    </button>

                </div>

            </div>


            <!-- Empty state (no conversation selected) -->
            <div class="chat-empty" id="chatEmpty">
                <div class="chat-empty-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.8 9.8 0 0 1-4.2-.9L3 21l1.8-4.4A8.1 8.1 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>
                    </svg>
                </div>
                <h3>No conversation selected</h3>
                <p>Pick a conversation or start a new message.</p>
            </div>


            <!-- Messages -->
            <div class="chat-messages" id="chatMessages">

                <div class="typing-indicator" id="typingIndicator">

                    <div class="avatar tiny-avatar" id="typingAvatar"></div>

                    <div class="typing-bubble">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>

            </div>


            <!-- Chat Composer -->
            <div class="chat-composer">

                <button class="composer-icon" aria-label="Add">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>

                <button class="composer-icon" aria-label="Add photo">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <circle cx="8.5" cy="10" r="1.5"/>
                        <path d="M21 15l-5-5L5 18"/>
                    </svg>
                </button>

                <div class="message-input-wrapper">

                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Write a message..."
                        autocomplete="off"
                        enterkeyhint="send"
                    >

                    <button class="emoji-btn" aria-label="Emoji">
                        😊
                    </button>

                </div>

                <button class="send-btn" id="sendBtn" aria-label="Send message">

                    <svg viewBox="0 0 24 24">
                        <path d="M22 2L11 13"/>
                        <path d="M22 2l-7 20-4-9-9-4z"/>
                    </svg>

                </button>

            </div>

        </section>


        <!-- ================= INFO PANEL ================= -->
        <aside class="info-panel" id="infoPanel">

            <div class="info-profile">

                <div class="avatar large-avatar" id="infoAvatar"></div>

                <h3 id="infoName"></h3>

                <p id="infoHandle"></p>

                <span class="active-status" id="infoStatus">
                    <i></i> <span id="infoStatusText">Active now</span>
                </span>

            </div>


            <div class="info-section">

                <button class="info-option">

                    <span class="option-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 3v18M3 12h18"/>
                        </svg>
                    </span>

                    Shared media

                    <span>›</span>

                </button>


                <button class="info-option">

                    <span class="option-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 4h16v16H4z"/>
                            <path d="M8 8h8M8 12h8M8 16h5"/>
                        </svg>
                    </span>

                    Shared files

                    <span>›</span>

                </button>


                <button class="info-option">

                    <span class="option-icon">
                        🔗
                    </span>

                    Shared links

                    <span>›</span>

                </button>

            </div>


            <div class="info-section">

                <button class="info-option">
                    <span class="option-icon"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></span>
                    Notifications
                    <span class="toggle active"></span>
                </button>

                <button class="info-option">
                    <span class="option-icon">🔕</span>
                    Mute conversation
                    <span class="toggle"></span>
                </button>

            </div>


            <button class="danger-option">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></svg> &nbsp; Block user
            </button>

        </aside>

    </main>


    <!-- ================= NEW MESSAGE MODAL ================= -->
    <div class="modal-overlay" id="newMessageModal">

        <div class="new-message-modal">

            <div class="modal-header">

                <h2>New message</h2>

                <button id="closeModal" aria-label="Close">
                    ×
                </button>

            </div>

            <div class="recipient-input">

                <label for="recipientInput">To</label>

                <input
                    type="text"
                    id="recipientInput"
                    placeholder="Search people..."
                    autocomplete="off"
                >

            </div>


            <!-- People from the LINKA system (rendered by messages.js) -->
            <div class="contact-list" id="contactList"></div>

        </div>

    </div>


    <!-- ================= DELETE MESSAGE CONFIRM ================= -->
    <div class="modal-overlay" id="deleteModal">

        <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">

            <h2 id="deleteTitle">Delete message?</h2>

            <p>This message will be removed from your conversation.</p>

            <div class="confirm-preview" id="deletePreview"></div>

            <div class="confirm-actions">
                <button type="button" class="confirm-cancel" id="deleteCancel">Cancel</button>
                <button type="button" class="confirm-delete" id="deleteConfirm">Delete</button>
            </div>

        </div>

    </div>


    <!-- Mobile bottom navigation (same icons as the Home page) -->
    <nav class="mobile-nav">

        <a class="mobile-nav-item" href="home.html">

            <svg viewBox="0 0 24 24">
                <path d="M3 11.5L12 4l9 7.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
            </svg>

            <span>Home</span>

        </a>


        <a class="mobile-nav-item" href="home.html">

            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7"/>
                <path d="M20 20l-4-4"/>
            </svg>

            <span>Explore</span>

        </a>


        <a class="mobile-create" href="home.html#create" aria-label="Create">

            <span>+</span>

        </a>


        <a class="mobile-nav-item active" href="messages.html">

            <svg viewBox="0 0 24 24">
                <path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.8 9.8 0 0 1-4.2-.9L3 21l1.8-4.4A8.1 8.1 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>
            </svg>

            <span>Chat</span>

        </a>


        <a class="mobile-nav-item" href="profile.html">

            <div class="mobile-avatar" id="navAvatar"></div>

            <span>Profile</span>

        </a>

    </nav>

</div>

<script src="linka-data.js"></script>
<script src="messages.js"></script>

  <script src="ui.js?v=3"></script><script src="connect.js?v=1"></script>
</body>
</html>
